<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 独立工作窗口</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#10141c;color:#e6edf7}body{margin:0}header{display:flex;gap:12px;align-items:center;padding:16px 20px;background:#192130;flex-wrap:wrap}h1{font-size:18px;margin:0 auto 0 0}select,button,textarea{font:inherit;background:#28354a;color:inherit;border:1px solid #50627e;border-radius:6px;padding:8px 12px}button:disabled{opacity:.45}#pause{background:#78373d}#takeover{background:#205847}main{padding:20px;max-width:1200px;margin:auto}#screen{display:block;width:100%;height:auto;background:#1a2331;border-radius:8px;pointer-events:none;user-select:none;touch-action:none}#screen.controlled{pointer-events:auto;outline:3px solid #61c5ab;cursor:crosshair}#screen[hidden],#keyboard[hidden],#handback[hidden],#takeover[hidden]{display:none}p{color:#a8b8cf;font-size:13px}#status{color:#87cba8}#error{color:#ffacac;white-space:pre-wrap}#keyboard{box-sizing:border-box;width:100%;margin-top:12px}#tree{white-space:pre-wrap;overflow-wrap:anywhere;max-height:280px;overflow:auto}
</style>
<header><h1>AI 独立工作窗口</h1><select id="target"><option value="browser">独立网页</option><option value="handoff">接力网页</option><option value="desktop">独立应用桌面</option></select><select id="tabs"></select><button id="pause">暂停 AI</button><button id="takeover" hidden>接管键鼠</button><button id="handback" hidden>交还 AI</button><select id="keymode" hidden aria-label="键盘输入方式"><option value="text">文字输入 / 中文</option><option value="physical">按键模式 / 连续按住</option></select><span id="status">连接中</span></header>
<main><p id="hint">默认读取控件，不截图。独立应用可接管键鼠；接管期间会为你更新画面，AI 的默认观察仍不截图。</p><button id="capture">查看一次截图</button><label id="live-box" hidden><input id="live" type="checkbox">实时预览（仅在本机显示）</label><pre id="tree"></pre><img id="screen" hidden draggable="false" alt="独立环境画面"><textarea id="keyboard" hidden rows="1" aria-label="独立桌面键盘输入" placeholder="点击画面后在此键入；支持中文输入及粘贴。Tab、方向键和快捷键发送到独立桌面。"></textarea><p id="error" role="status"></p></main><script type="module" src="viewer.js"></script></html>
